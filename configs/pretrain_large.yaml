# MaskDistill ViT-Large Pretraining Configuration
#
# ViT-Large/16: embed_dim=1024, depth=24, heads=16
# Dense encoding with block masking at 40%, shared relative position bias.
#
# Reference: "A Unified View of Masked Image Modeling" (arXiv:2210.10615)

wandb_meta:
  project: MaskDistill_pretrain
  entity: null
  name: maskdistill_large_block40
  desc: 'MaskDistill ViT-Large: Block masking 40%, dense encoding'
model:
  student:
    name: vit_large_patch16
    img_size: 224
    patch_size: 16
    embed_dim: 1024
    depth: 24
    num_heads: 16
    drop_path_rate: 0.2
    init_values: 1.0e-05
    use_abs_pos_emb: false
    use_rel_pos_bias: false
    use_shared_rel_pos_bias: true
    use_mask_tokens: true
  teacher:
    name: ViT-B/16
    embed_dim: 768
data:
  batch_per_gpu: 128
  num_workers: 16
  data_path: /path/to/imagenet
  train_dir: /path/to/imagenet/train
  val_dir: /path/to/imagenet/val
  subset: null
  subset_start: 0
  augmentation:
    min_scale: 0.2
    max_scale: 1.0
    horizontal_flip_prob: 0.5
    color_jitter: 0.4
mask:
  mask_ratio: 0.4
  mask_type: block
  shuffle_patches: false
optim:
  lr: 0.0015
  wd: 0.05
  betas:
  - 0.9
  - 0.999
  layer_decay: 1.0
  accum_iter: 1
  grad_clip: 3.0
schedule:
  min_lr: 1.0e-05
  warmup_epochs: 10
  warmup_start_lr: 1.0e-05
losses:
  use_head_loss: true
  head_loss_weight: 1.0
  head:
    type: smooth_l1
    beta: 1.0
  normalize_targets: true
  normalize_predictions: false
  normalization_method: variance
visualizations:
  enable: true
  layers_to_analyze:
  - 0
  - 12
  - 23
  attention_heads_to_show: 4
  plots:
    raw_attention: false
    layer_evolution: true
    head_comparison: true
    attention_rollout: false
epochs: 300
cpu: false
seed: 42
precision: bf16
log_interval: 25
output_dir: ./output/pretrain
resume_path: null
gpu: 0
distributed: true
dist_backend: nccl
dist_url: env://
dist_on_itp: true
rank: 0
world_size: 4
local_rank: 0
